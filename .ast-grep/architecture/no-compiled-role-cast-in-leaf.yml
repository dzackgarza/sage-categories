id: no-compiled-role-cast-in-leaf
language: python
severity: error
files:
  - src/sage_categories/sets/**/*.py
  - src/sage_categories/order/**/*.py
  - src/sage_categories/algebra/**/*.py
  - src/sage_categories/geometry/**/*.py
message: POL-LEAF-066 — a production leaf must not construct a compiled role through cast(Any, ...)
rule:
  any:
    - pattern: cast(Any, $OWNER).MorphismType($$$ARGS)
    - pattern: cast(Any, $OWNER).ObjectType($$$ARGS)
    - pattern: cast(Any, $OWNER).ElementType($$$ARGS)
