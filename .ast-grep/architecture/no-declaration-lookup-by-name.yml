id: no-declaration-lookup-by-name
language: python
severity: error
files:
  - src/sage_categories/sets/**/*.py
  - src/sage_categories/posets/**/*.py
  - src/sage_categories/algebra/**/*.py
  - src/sage_categories/number_sets/**/*.py
  - src/sage_categories/ordinals/**/*.py
  - tests/kernel/**/*.sage
ignores:
  - src/sage_categories/**/_*_sage.py
message: POL-LEAF-077, POL-LEAF-064, D89, D133
rule:
  any:
    - pattern: $X.declarations()[$$$]
    - pattern: _implements = $S
