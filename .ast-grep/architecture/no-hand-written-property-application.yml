id: no-hand-written-property-application
language: python
severity: error
files:
  - src/sage_categories/sets/**/*.py
  - src/sage_categories/posets/**/*.py
  - src/sage_categories/algebra/**/*.py
  - src/sage_categories/number_sets/**/*.py
  - src/sage_categories/ordinals/**/*.py
  - tests/kernel/**/*.sage
ignores:
  - src/sage_categories/**/_*_sage.py
message: POL-LEAF-068, D89, D133
rule:
  kind: function_definition
  all:
    - has:
        field: name
        regex: ^(is|has)_[a-z0-9_]+$
    - has:
        field: parameters
        regex: ^\(self\)$
  inside:
    kind: class_definition
    stopBy: end
