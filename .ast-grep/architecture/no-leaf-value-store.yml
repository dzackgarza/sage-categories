id: no-leaf-value-store
language: python
severity: error
files:
  - src/sage_categories/sets/**/*.py
  - src/sage_categories/posets/**/*.py
  - src/sage_categories/algebra/**/*.py
  - src/sage_categories/number_sets/**/*.py
  - src/sage_categories/ordinals/**/*.py
ignores:
  - src/sage_categories/**/_*_sage.py
message: POL-LEAF-066, D111, D133
rule:
  any:
    - pattern: '$STORE: MonoDict = MonoDict()'
    - pattern: '$STORE: dict[$$$] = {}'
    - pattern: '$STORE: dict = {}'
    - pattern: '@cached_method($$$)'
    - pattern: '@cached_method'
    - pattern: '@cached_function($$$)'
    - pattern: '@cached_function'
