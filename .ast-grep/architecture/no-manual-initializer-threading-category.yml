id: no-manual-initializer-threading-category
language: python
severity: error
files:
  - src/sage_categories/sets/**/*.py
  - src/sage_categories/posets/**/*.py
  - src/sage_categories/algebra/**/*.py
  - src/sage_categories/number_sets/**/*.py
  - src/sage_categories/ordinals/**/*.py
ignores:
  - src/sage_categories/**/_*_sage.py
message: POL-LEAF-063, D133, D13
rule:
  any:
    - pattern: super().__init__($$$)
    - pattern: $BASE.__init__(self, $$$)
  inside:
    kind: class_definition
    stopBy: end
    has:
      field: superclasses
      regex: (Category|Subcategory|SliceProperty)
