id: no-manual-initializer-threading
language: python
severity: error
files:
  - src/sage_categories/**/*.py
ignores:
  - src/sage_categories/kernel/**
message: >-
  D13 / specs/resolution.md "Acceptance conditions": the kernel runs every reached
  local initializer itself, each with its owner's datum, and threads inherited state
  through the selected structure functors. A theory declaration stores its own datum
  and calls no initializer of any class.
rule:
  any:
    - pattern: super().__init__($$$)
    - pattern: $BASE.__init__(self, $$$)
  inside:
    kind: class_definition
    stopBy: end
    has:
      field: name
      regex: (ObjectType|ElementType|MorphismType|Declaration)$
