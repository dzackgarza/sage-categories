id: no-native-realization-outside-leaf-firewall
language: python
severity: error
files:
  - src/sage_categories/sets/**/*.py
  - src/sage_categories/order/**/*.py
  - src/sage_categories/algebra/**/*.py
  - src/sage_categories/geometry/**/*.py
ignores:
  - src/sage_categories/**/_firewall/**/*.py
message: POL-LEAF-FIREWALL — native realization registries belong behind the leaf-local _firewall boundary
rule:
  any:
    - pattern: from sage_categories.cat.native import $$$NAMES
    - pattern: import sage_categories.cat.native
