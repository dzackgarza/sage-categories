id: no-sage-category-graph
language: python
severity: error
files:
  - src/sage_categories/**/*.py
message: POL-LEAF-067, POL-SCOPE-012, D01
rule:
  all:
    - pattern: from sage.categories.$MOD import $$$
    - not:
        any:
          - pattern: from sage.categories.category import $$$
          - pattern: from sage.categories.category_with_axiom import $$$
