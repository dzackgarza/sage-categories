id: no-union-parameter
language: python
severity: error
files:
  - tests/kernel/**/*.sage
ignores:
  - src/sage_categories/**/_*_sage.py
message: POL-LEAF-073, D52, D133
rule:
  any:
    - kind: typed_parameter
      has:
        kind: binary_operator
        regex: \|
        stopBy: end
    - kind: typed_default_parameter
    - kind: default_parameter
