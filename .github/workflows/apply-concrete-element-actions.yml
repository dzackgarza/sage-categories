name: Apply concrete element actions

on:
  push:
    branches:
      - codex/functorial-core-kernel

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/functorial-core-kernel
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Remove the structural-functor subtype and registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roots = (Path('src'), Path('tests'))
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.py', '.sage'}:
                      continue
                  source = path.read_text()
                  updated = source.replace('RestrictedStructuralFunctor', 'RestrictedConcreteFunctor')
                  updated = updated.replace('StructuralFunctor', 'ConcreteFunctor')
                  updated = updated.replace('is_structural_functor', 'is_concrete_functor')
                  if updated != source:
                      path.write_text(updated)

          core = Path('src/sage_categories/abstract_categories/functor_core.py')
          source = core.read_text()
          source = source.replace('        _STRUCTURAL_FUNCTORS[id(self)] = self\n', '')
          source = source.replace('        _CONCRETE_FUNCTORS[id(self)] = self\n', '')
          for registry_name in ('_STRUCTURAL_FUNCTORS', '_CONCRETE_FUNCTORS'):
              marker = f'{registry_name}: dict[int, ConcreteFunctor] = {{}}'
              if marker not in source:
                  continue
              start = source.index(marker)
              end = source.index('\n\nclass IdentityFunctor', start)
              source = source[:start] + '''def is_concrete_functor(\n    candidate: MathematicalObject,\n) -> TypeIs[ConcreteFunctor]:\n    """Narrow an ordinary functor to one with a concrete element action."""\n    return isinstance(candidate, ConcreteFunctor)\n''' + source[end:]
          source = source.replace(
              'class ConcreteFunctor(Functor, ABC):\n    """A functor selected to provide inherited object and element methods."""',
              'class ConcreteFunctor(Functor, ABC):\n    """An ordinary functor whose concrete theory defines an element action.\n\n    This is an implementation role for concrete functor categories, not a\n    structural-functor kind.  Selection remains solely a use of the ordinary\n    functor object in ``structure_functors()``.\n    """',
          )
          core.write_text(source)

          category = Path('src/sage_categories/category.py')
          source = category.read_text()
          source = source.replace('tuple[ConcreteFunctor, ...]', 'tuple[Functor, ...]')
          category.write_text(source)

          public_init = Path('src/sage_categories/__init__.py')
          if public_init.exists():
              source = public_init.read_text()
              source = source.replace('    ConcreteFunctor,\n', '')
              source = source.replace('    "ConcreteFunctor",\n', '')
              public_init.write_text(source)

          forbidden = ('StructuralFunctor', '_STRUCTURAL_FUNCTORS', '_CONCRETE_FUNCTORS')
          violations = []
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.py', '.sage'}:
                      continue
                  text = path.read_text()
                  for token in forbidden:
                      if token in text:
                          violations.append((str(path), token))
          assert not violations, violations
          PY
          rm -f .github/workflows/apply-concrete-element-actions.yml
          python -m compileall -q src
          git diff --check
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add -A
          git commit -m 'refactor: keep element actions outside the ordinary functor definition'
          git push origin HEAD:codex/functorial-core-kernel
