name: Apply concrete-functor separation

on:
  push:
    branches:
      - codex/functorial-core-kernel

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/functorial-core-kernel
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Separate concrete element actions from ordinary functors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roots = (Path('src'), Path('tests'))
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.py', '.sage'}:
                      continue
                  source = path.read_text()
                  updated = source.replace('RestrictedStructuralFunctor', 'RestrictedConcreteFunctor')
                  updated = updated.replace('StructuralFunctor', 'ConcreteFunctor')
                  updated = updated.replace('is_structural_functor', 'is_concrete_functor')
                  path.write_text(updated)

          core = Path('src/sage_categories/abstract_categories/functor_core.py')
          source = core.read_text()
          source = source.replace(
              'class ConcreteFunctor(Functor, ABC):\n    """A functor selected to provide inherited object and element methods."""',
              'class ConcreteFunctor(Functor, ABC):\n    """A functor in a concrete theory with a mathematically defined element action.\n\n    Every instance remains an ordinary arrow of ``Cat``.  This implementation role\n    exists only for concrete theories whose functor construction supplies an action\n    on elements; it is not selected or registered as a structural-functor kind.\n    """',
          )
          source = source.replace('        _STRUCTURAL_FUNCTORS[id(self)] = self\n', '')

          start = source.index('_STRUCTURAL_FUNCTORS: dict[int, ConcreteFunctor] = {}')
          end = source.index('\n\nclass IdentityFunctor', start)
          replacement = '''def is_concrete_functor(\n    candidate: MathematicalObject,\n) -> TypeIs[ConcreteFunctor]:\n    """Return whether this ordinary functor has a concrete element action."""\n    return isinstance(candidate, ConcreteFunctor)\n'''
          source = source[:start] + replacement + source[end:]
          core.write_text(source)

          forbidden = ('StructuralFunctor', '_STRUCTURAL_FUNCTORS', 'is_structural_functor')
          violations = []
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.py', '.sage'}:
                      continue
                  text = path.read_text()
                  for token in forbidden:
                      if token in text:
                          violations.append((path, token))
          assert not violations, violations
          PY
          rm .github/workflows/apply-concrete-functors.yml
          python -m compileall -q src
          git diff --check
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add -A
          git commit -m 'refactor: separate concrete element actions from functors'
          git push origin HEAD:codex/functorial-core-kernel
