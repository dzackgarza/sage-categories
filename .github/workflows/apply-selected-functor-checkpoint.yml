name: Apply selected-functor checkpoint

on:
  push:
    branches:
      - codex/functorial-core-kernel

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/functorial-core-kernel
          fetch-depth: 0
      - name: Apply and push the selected-functor checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat .kernel-sync/patch-* | base64 --decode | gzip --decompress > /tmp/kernel.patch
          git apply --index /tmp/kernel.patch
          rm -rf .kernel-sync
          rm -f .github/workflows/apply-selected-functor-checkpoint.yml
          if rg --line-number 'super_functors|StructuralFunctor|RestrictedStructuralFunctor|_STRUCTURAL_FUNCTORS|is_structural_functor' src tests; then
            echo 'Rejected compatibility architecture remains.' >&2
            exit 1
          fi
          python -m compileall -q src
          git diff --cached --check
          git add -A
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'refactor: make structure functors ordinary selected functors'
          git push origin HEAD:codex/functorial-core-kernel
