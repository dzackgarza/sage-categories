name: Functorial kernel acceptance

on:
  pull_request: {}

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v4
      - name: Install runner tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Clone QC infrastructure
        run: git clone --depth 1 https://github.com/dzackgarza/ai-review-ci.git "$HOME/ai-review-ci"
      - name: Provision Sage
        run: just ci-provision-sage
      - name: Run full repository acceptance
        run: just test-ci
