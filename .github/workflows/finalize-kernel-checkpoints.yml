name: Finalize kernel checkpoints

on:
  push:
    branches:
      - codex/functorial-core-kernel

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/functorial-core-kernel
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Remove transfer workflows and commit landed source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-structure-functors.yml
          rm -f .github/workflows/apply-concrete-functors.yml
          rm -f .github/workflows/apply-structural-graph.yml
          rm -f .github/workflows/apply-concrete-element-actions.yml
          rm -f .github/workflows/apply-functor-properties.yml
          rm -f .github/workflows/finalize-kernel-checkpoints.yml
          python -m compileall -q src
          git diff --check
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add -A
          git commit -m 'chore: remove kernel transfer workflows'
          git push origin HEAD:codex/functorial-core-kernel
