[package]
name = "sage-categories-homotopy"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "sage_categories_homotopy"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }
homotopy-core = { git = "https://github.com/homotopy-io/homotopy-rs.git", rev = "c51f0cd7625ff2e994b247089c6d64ba7c28be1a", package = "homotopy-core" }
good_lp = { version = "=1.3.2", default-features = false, features = ["minilp"] }

[patch.crates-io]
petgraph = { git = "https://github.com/NickHu/petgraph", rev = "80fa2cf0ed777fcc0b4d9276a577b234d3a9eaa8" }
