[project]
name = "sage-categories"
version = "0.1.0"
description = "Owned Sage categories."
requires-python = "==3.14.*"
dependencies = [
    "attrs>=26.1,<27",
    "discopy==1.2.2",
    "juliacall>=0.9.35,<0.9.37",
    "makefun>=1.16",
    "maude>=1.6,<2",
    "multimethod>=2.1",
    "plum-dispatch>=2.9,<3",
    "sage-categories-homotopy @ git+https://github.com/dzackgarza/sage-categories.git@df6e6aadbcd0480b87154f8ed573f123dbba8f3d#subdirectory=native/homotopy-python",
    "sympy>=1.14,<2",
    "wrapt",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sage_categories = ["juliapkg.json", "engines/*.jl", "engines/OscarProject.toml"]
[dependency-groups]
dev = [
    "hypothesis>=6.165,<7",
    "mypy>=2",
    "pytest>=9.1,<10",
    "ruff>=0.16.5,<1",
    "sage-mypy-category-plugin @ git+https://github.com/dzackgarza/sagemath-mypy-plugin@main",
    "sage-stubs @ git+https://github.com/dzackgarza/sage-stubs.git@main",
    "microsoft-python-type-stubs @ git+https://github.com/dzackgarza/python-type-stubs.git@main",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]
migration = [
    "libcst>=1.9,<2",
]


[tool.importlinter]
root_package = "sage_categories"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "The kernel imports no module of Cat"
type = "forbidden"
source_modules = ["sage_categories.kernel"]
forbidden_modules = ["sage_categories.cat"]

[[tool.importlinter.contracts]]
name = "The kernel imports no module of cat_kernel"
type = "forbidden"
source_modules = ["sage_categories.kernel"]
forbidden_modules = ["sage_categories.cat_kernel"]

[[tool.importlinter.contracts]]
name = "Cat imports no module of cat_kernel"
type = "forbidden"
source_modules = ["sage_categories.cat"]
forbidden_modules = ["sage_categories.cat_kernel"]

[[tool.importlinter.contracts]]
name = "Production leaves import no kernel internals"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "sage_categories.sets",
    "sage_categories.order",
    "sage_categories.algebra",
    "sage_categories.geometry",
]
forbidden_modules = ["sage_categories.kernel", "sage_categories.cat_kernel"]
broken_contract_guidance = "Production mathematics must use Cat/public owners. Move backend conversion behind the leaf-local _firewall boundary; categorical propagation belongs to Cat/kernel."

[[tool.importlinter.contracts]]
name = "Production leaves import no Sage runtime directly"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "sage_categories.sets",
    "sage_categories.order",
    "sage_categories.algebra",
    "sage_categories.geometry",
]
forbidden_modules = ["sage"]
ignore_imports = ["sage_categories.*._firewall.** -> sage"]
unmatched_ignore_imports_alerting = "none"
broken_contract_guidance = "Move Sage/backend conversion into an explicit private firewall/engine boundary and return owned mathematical objects."

[[tool.importlinter.contracts]]
name = "Foundation layers import no production leaf"
type = "forbidden"
source_modules = ["sage_categories.kernel", "sage_categories.cat", "sage_categories.cat_kernel"]
forbidden_modules = [
    "sage_categories.sets",
    "sage_categories.order",
    "sage_categories.algebra",
    "sage_categories.geometry",
]
broken_contract_guidance = "Move the dependency to a generic Cat/kernel abstraction or invert it through a retained public functor/interface."


[[tool.importlinter.contracts]]
name = "Only the kernel's Sage runtime module and the named engine modules import Sage"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["sage_categories.kernel", "sage_categories.cat", "sage_categories.engines"]
forbidden_modules = ["sage"]
ignore_imports = ["sage_categories.kernel.sage_runtime -> sage", "sage_categories.engines.gap -> sage", "sage_categories.engines.finite_sets -> sage", "sage_categories.engines.fp_categories -> sage", "sage_categories.engines.functor_categories -> sage", "sage_categories.engines.slice_categories -> sage", "sage_categories.engines.category_products -> sage", "sage_categories.engines.category_limits -> sage", "sage_categories.engines.free_algebras -> sage", "sage_categories.engines.presented_modules -> sage", "sage_categories.engines.order_relations -> sage"]

[tool.uv.workspace]
members = ["native/homotopy-python"]

[tool.uv.sources]
sage-categories-homotopy = { workspace = true }
