[project]
name = "sage-categories"
version = "0.1.0"
description = "Owned Sage categories."
requires-python = ">=3.14,<3.15"
dependencies = [
    "attrs>=26.1,<27",
    "makefun>=1.16",
    "multimethod>=2.1",
    "plum-dispatch>=2.9,<3",
    "sympy>=1.14,<2",
    "wrapt",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sage_categories = ["juliapkg.json"]
[dependency-groups]
dev = [
    "hypothesis>=6.165,<7",
    "mypy>=2",
    "pytest>=9.1,<10",
    "ruff>=0.16.5,<1",
    "sage-mypy-category-plugin @ git+https://github.com/dzackgarza/sagemath-mypy-plugin@main",
    "microsoft-python-type-stubs @ git+https://github.com/microsoft/python-type-stubs.git",
]
migration = [
    "libcst>=1.9,<2",
]
platform = ["juliacall>=0.9.35,<0.10"]
